<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium 3D Blob • Grace & Truth — Interactive Glass Morphism</title>
<meta name="description" content="Premium interactive 3D organic blob with soft physics, iridescent glass and floating bubbles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --soft-blue:#E8F2FF;
    --lavender:#EDE8FF;
    --baby-pink:#FFEAF3;
    --mint:#E7FFF4;
    --pearl:#FFFFFF;
    --iri-blue:#6AA9FF;
    --iri-purple:#B07CFF;
    --iri-cyan:#7EE8FF;
    --light-gray:#EAEAEA;
  }
  html,body{height:100%;overflow:hidden;background:var(--soft-blue)}
  body{
    font-family:Inter,system-ui,sans-serif;
    background:
      radial-gradient(1200px 800px at 20% 15%, var(--lavender) 0%, transparent 55%),
      radial-gradient(1000px 700px at 85% 20%, var(--baby-pink) 0%, transparent 50%),
      radial-gradient(900px 600px at 50% 95%, var(--mint) 0%, transparent 60%),
      linear-gradient(180deg, var(--soft-blue) 0%, #F6F8FF 55%, #FFFFFF 100%);
  }
  #canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  /* Header */
  .header{
    position:fixed;top:20px;left:20px;right:20px;z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    max-width:1200px;margin:0 auto;
    background:rgba(255,255,255,0.72);
    backdrop-filter:blur(16px) saturate(1.4);
    -webkit-backdrop-filter:blur(16px) saturate(1.4);
    border:1px solid rgba(255,255,255,0.8);
    border-radius:16px;
    padding:14px 18px;
    box-shadow:0 8px 32px rgba(15,32,55,0.08), 0 1px 2px rgba(15,32,55,0.06);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{
    width:40px;height:40px;border-radius:12px;
    background: radial-gradient(120% 120% at 30% 20%, var(--iri-blue) 0%, var(--iri-purple) 55%, var(--iri-cyan) 100%);
    box-shadow:0 4px 16px rgba(106,169,255,0.35), inset 0 1px 1px rgba(255,255,255,0.8);
  }
  .brand h1{font-family:"Cormorant Garamond",serif;font-size:15px;font-weight:600;color:#0F2037;letter-spacing:-0.02em;line-height:1}
  .brand p{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#6B7A99;margin-top:2px;font-weight:600}
  .header-actions{display:flex;align-items:center;gap:10px}
  .pill{
    font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;
    color:#0F2037;background:rgba(255,255,255,0.9);border:1px solid rgba(15,32,55,0.06);
    padding:8px 12px;border-radius:999px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#6AA9FF;box-shadow:0 0 0 6px rgba(106,169,255,0.12);display:inline-block}
  /* Footer info */
  .info{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
    background:rgba(255,255,255,0.78);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.85);border-radius:999px;
    padding:10px 18px;display:flex;align-items:center;gap:18px;
    box-shadow:0 8px 24px rgba(15,32,55,0.08);
    font-size:12px;color:#4A5A7A;
    max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;
  }
  .info strong{color:#0F2037;font-weight:600}
  .info .sep{width:1px;height:14px;background:rgba(15,32,55,0.08)}
  /* Palette */
  .palette{
    position:fixed;bottom:20px;left:20px;z-index:10;display:none;
    background:rgba(255,255,255,0.75);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.8);border-radius:14px;padding:10px 12px;
    gap:8px;align-items:center;
  }
  .palette span{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.12);display:inline-block}
  @media(min-width:900px){.palette{display:flex}}
  /* Cursor hint */
  .cursor-hint{
    position:fixed;pointer-events:none;z-index:9;left:0;top:0;transform:translate(-50%,-50%);
    width:120px;height:120px;border-radius:50%;
    border:1px solid rgba(106,169,255,0.18);
    background:radial-gradient(circle at center, rgba(106,169,255,0.08) 0%, rgba(176,124,255,0.06) 35%, transparent 70%);
    opacity:0;transition:opacity 0.4s;
  }
  .cursor-hint.active{opacity:1}
</style>
</head>
<body>
<canvas id="canvas" aria-label="Interactive 3D blob scene"></canvas>
<div class="cursor-hint" id="cursorHint"></div>

<header class="header">
  <div class="brand">
    <div class="brand-mark"></div>
    <div>
      <h1>Grace &amp; Truth — Premium Blob</h1>
      <p>Interactive 3D • Glass Morphism</p>
    </div>
  </div>
  <div class="header-actions">
    <span class="pill"><span class="dot"></span> 60 FPS • WebGL</span>
    <span class="pill" id="bubbleCount">18 bubbles</span>
  </div>
</header>

<div class="palette" aria-hidden="true">
  <span style="background:#E8F2FF" title="Soft Blue"></span>
  <span style="background:#EDE8FF" title="Lavender"></span>
  <span style="background:#FFEAF3" title="Baby Pink"></span>
  <span style="background:#E7FFF4" title="Mint"></span>
  <span style="background:#6AA9FF" title="Iridescent Blue"></span>
  <span style="background:#B07CFF" title="Iridescent Purple"></span>
  <span style="background:#7EE8FF" title="Iridescent Cyan"></span>
</div>

<div class="info">
  <span><strong>Move</strong> cursor to attract</span>
  <span class="sep"></span>
  <span><strong>Hover</strong> to pick bubbles</span>
  <span class="sep"></span>
  <span>Blob breathes &amp; follows</span>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ——— Scene Setup ———
const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xE8F2FF);
scene.fog = new THREE.Fog(0xE8F2FF, 12, 22);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = false;

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.2, 7.2);

// ——— Environment ———
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0xE8F2FF);
const roomEnv = new RoomEnvironment();
const envTex = pmrem.fromScene(roomEnv, 0.04).texture;
scene.environment = envTex;

// ——— Lighting (studio soft) ———
scene.add(new THREE.HemisphereLight(0xE8F2FF, 0xFFEAF3, 0.9));
const dir = new THREE.DirectionalLight(0xffffff, 2.2);
dir.position.set(4, 8, 6);
scene.add(dir);
const fill = new THREE.DirectionalLight(0xE7FFF4, 0.9);
fill.position.set(-5, 2, 4);
scene.add(fill);
const p1 = new THREE.PointLight(0x6AA9FF, 28, 12);
p1.position.set(3.2, 2.8, 3.5);
scene.add(p1);
const p2 = new THREE.PointLight(0xB07CFF, 22, 12);
p2.position.set(-2.8, 1.2, 3.8);
scene.add(p2);
const p3 = new THREE.PointLight(0x7EE8FF, 16, 10);
p3.position.set(0.2, -3.2, 4.2);
scene.add(p3);

// ——— Blob Geometry + Material ———
const blobGeo = new THREE.SphereGeometry(1.55, 96, 96);
// store original positions for morph
const posAttr = blobGeo.attributes.position;
const origPos = posAttr.clone();

const blobMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.78,
  roughness: 0.08,
  metalness: 0.0,
  transmission: 0.96,
  thickness: 1.35,
  ior: 1.38,
  clearcoat: 1.0,
  clearcoatRoughness: 0.12,
  envMapIntensity: 1.35,
  attenuationDistance: 6,
  attenuationColor: new THREE.Color(0xE8F2FF)
});

// Iridescence via onBeforeCompile — inject fresnel color mix
blobMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = { value: 0 };
  shader.uniforms.uMouseLocal = { value: new THREE.Vector3(999, 999, 999) };
  shader.uniforms.uHover = { value: 0 };
  blobMat.userData.shader = shader;

  shader.vertexShader = `
    uniform float uTime;
    uniform vec3 uMouseLocal;
    varying vec3 vLocalPos;
    varying float vMouseDist;
    // simplex noise
    vec3 mod289(vec3 x){return x - floor(x * (1.0/289.0)) * 289.0;}
    vec4 mod289(vec4 x){return x - floor(x * (1.0/289.0)) * 289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
    float snoise(vec3 v){
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod289(i);
      vec4 p = permute(permute(permute(
        i.z + vec4(0.0, i1.z, i2.z, 1.0))
        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 0.142857142857;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ *ns.x + ns.yyyy;
      vec4 y = y_ *ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
      vec3 p0 = vec3(a0.xy,h.x);
      vec3 p1 = vec3(a0.zw,h.y);
      vec3 p2 = vec3(a1.xy,h.z);
      vec3 p3 = vec3(a1.zw,h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }
    ${shader.vertexShader}
  `.replace(
    '#include <common>',
    `#include <common>
     uniform float uTime;
     uniform vec3 uMouseLocal;
     varying vec3 vLocalPos;
     varying float vMouseDist;
    `
  ).replace(
    '#include <begin_vertex>',
    `#include <begin_vertex>
     vLocalPos = position;
     // base breathing
     float n = snoise(position * 1.15 + uTime * 0.35);
     float n2 = snoise(position * 2.1 - uTime * 0.22);
     float breath = sin(uTime * 0.55) * 0.06 + cos(uTime * 0.31) * 0.04;
     float disp = n * 0.18 + n2 * 0.07 + breath;
     // mouse deform - pull toward cursor
     float d = distance(position, uMouseLocal);
     float influence = smoothstep(2.4, 0.0, d) * 0.55;
     vec3 toMouse = normalize(uMouseLocal - position);
     vMouseDist = d;
     // combine
     transformed += normal * (disp + influence * 0.28);
     transformed += toMouse * influence * 0.18;
    `
  );

  shader.fragmentShader = `
    varying vec3 vLocalPos;
    varying float vMouseDist;
    ${shader.fragmentShader}
  `.replace(
    '#include <common>',
    `#include <common>
     varying vec3 vLocalPos;
     varying float vMouseDist;
    `
  ).replace(
    'vec4 diffuseColor = vec4( diffuse, opacity );',
    `
    vec4 diffuseColor = vec4( diffuse, opacity );
    // iridescent fresnel
    vec3 viewDir = normalize(cameraPosition - vViewPosition);
    float fres = pow(1.0 - max(0.0, dot(normalize(vNormal), viewDir)), 2.2);
    vec3 colBlue = vec3(0.42, 0.66, 1.0);
    vec3 colPurple = vec3(0.69, 0.49, 1.0);
    vec3 colCyan = vec3(0.49, 0.91, 1.0);
    vec3 colPink = vec3(1.0, 0.68, 0.82);
    // position based gradient
    float t = vLocalPos.y * 0.25 + 0.5;
    vec3 baseGrad = mix(colBlue, colPurple, smoothstep(-0.5, 0.5, vLocalPos.y));
    baseGrad = mix(baseGrad, colCyan, smoothstep(0.2, 0.9, vLocalPos.x * 0.5 + 0.5) * 0.35);
    baseGrad = mix(baseGrad, colPink, fres * 0.35);
    // subtle mouse tint
    float mouseGlow = smoothstep(2.2, 0.0, vMouseDist) * 0.28;
    baseGrad += mouseGlow * vec3(0.25, 0.35, 0.55);
    // fresnel edge
    vec3 fresCol = mix(baseGrad, vec3(1.0), fres * 0.55);
    diffuseColor.rgb = mix(diffuseColor.rgb, fresCol, 0.72 + fres * 0.28);
    // soft internal depth
    diffuseColor.rgb += vec3(0.04, 0.06, 0.08) * (1.0 - fres);
    `
  );
};

const blob = new THREE.Mesh(blobGeo, blobMat);
blob.position.set(0, 0.05, 0);
scene.add(blob);

// ——— Bubbles ———
const bubbleGeo = new THREE.SphereGeometry(1, 32, 32);
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.62,
  roughness: 0.06,
  metalness: 0.0,
  transmission: 0.92,
  thickness: 0.65,
  ior: 1.32,
  clearcoat: 1.0,
  clearcoatRoughness: 0.08,
  envMapIntensity: 1.15
});
bubbleMat.onBeforeCompile = (shader) => {
  shader.fragmentShader = shader.fragmentShader.replace(
    'vec4 diffuseColor = vec4( diffuse, opacity );',
    `
    vec4 diffuseColor = vec4( diffuse, opacity );
    vec3 viewDir = normalize(cameraPosition - vViewPosition);
    float fres = pow(1.0 - max(0.0, dot(normalize(vNormal), viewDir)), 2.0);
    vec3 iri = mix(vec3(0.42,0.66,1.0), vec3(0.69,0.49,1.0), fres);
    iri = mix(iri, vec3(0.55,0.92,1.0), fres * 0.4);
    diffuseColor.rgb = mix(diffuseColor.rgb, iri, 0.55);
    diffuseColor.rgb += fres * 0.18;
    `
  );
};

const bubbles = [];
const bubbleCount = 18;
const bubbleScales = [];
for (let i=0;i<bubbleCount;i++){
  const s = THREE.MathUtils.lerp(0.14, 0.42, Math.pow(Math.random(), 1.4));
  bubbleScales.push(s);
  const m = bubbleMat.clone();
  m.opacity = THREE.MathUtils.lerp(0.45, 0.75, Math.random());
  const mesh = new THREE.Mesh(bubbleGeo, m);
  mesh.scale.setScalar(s);
  // spherical distribution
  const phi = Math.acos(-1 + (2*i)/bubbleCount);
  const theta = Math.sqrt(bubbleCount * Math.PI) * phi;
  const r = THREE.MathUtils.lerp(2.2, 4.1, Math.random());
  mesh.position.set(
    r * Math.cos(theta) * Math.sin(phi),
    r * Math.sin(theta) * Math.sin(phi) * 0.9,
    r * Math.cos(phi) * 0.85
  );
  mesh.userData = {
    basePos: mesh.position.clone(),
    vel: new THREE.Vector3(
      (Math.random()-0.5)*0.008,
      (Math.random()-0.5)*0.008,
      (Math.random()-0.5)*0.008
    ),
    phase: Math.random()*Math.PI*2,
    speed: THREE.MathUtils.lerp(0.25, 0.85, Math.random()),
    picked: false,
    pickOffset: new THREE.Vector3()
  };
  scene.add(mesh);
  bubbles.push(mesh);
}
document.getElementById('bubbleCount').textContent = `${bubbleCount} bubbles`;

// ——— Mouse ———
const mouse = new THREE.Vector2(0,0);
const mouseWorld = new THREE.Vector3(0,0,1.5);
const mouseLocal = new THREE.Vector3(999,999,999);
const blobTarget = new THREE.Vector3(0,0.05,0);
const hint = document.getElementById('cursorHint');
let mouseActive = false;

function onMove(e){
  const x = (e.clientX ?? e.touches?.[0].clientX) / window.innerWidth;
  const y = (e.clientY ?? e.touches?.[0].clientY) / window.innerHeight;
  mouse.set(x*2 -1, -(y*2 -1));
  // project mouse to world plane z≈1.2
  mouseWorld.set(mouse.x * 3.2, mouse.y * 1.9, 1.2);
  // hint
  hint.style.left = (e.clientX ?? e.touches?.[0].clientX) + 'px';
  hint.style.top = (e.clientY ?? e.touches?.[0].clientY) + 'px';
  hint.classList.add('active');
  mouseActive = true;
}
window.addEventListener('mousemove', onMove);
window.addEventListener('touchmove', onMove, {passive:false});
window.addEventListener('mouseleave', ()=>{ hint.classList.remove('active'); });
// subtle hide after idle
setTimeout(()=>hint.classList.remove('active'), 4000);

// ——— Ground shadow (fake) ———
const shadowGeo = new THREE.CircleGeometry(2.2, 64);
const shadowMat = new THREE.MeshBasicMaterial({ color: 0xEAEAEA, transparent:true, opacity:0.0 });
const shadow = new THREE.Mesh(shadowGeo, shadowMat);
shadow.rotation.x = -Math.PI/2;
shadow.position.set(0, -1.85, 0);
scene.add(shadow);

// ——— Animation Loop ———
let t = 0;
const clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const delta = clock.getDelta();
  t += delta;

  // blob breathing + slow rotation
  blob.rotation.y += delta * 0.07;
  blob.rotation.x = Math.sin(t*0.18)*0.08;
  blob.rotation.z = Math.cos(t*0.22)*0.06;

  // blob follow mouse with easing
  const targetX = mouseActive ? mouseWorld.x * 0.38 : 0;
  const targetY = mouseActive ? mouseWorld.y * 0.28 : 0.05;
  blobTarget.x += (targetX - blobTarget.x) * 0.04;
  blobTarget.y += (targetY - blobTarget.y) * 0.04;
  blob.position.x += (blobTarget.x - blob.position.x) * 0.045;
  blob.position.y += (blobTarget.y - blob.position.y) * 0.045;
  // scale breathing
  const s = 1 + Math.sin(t*0.62)*0.035 + Math.cos(t*0.83)*0.02;
  blob.scale.set(s, s*1.02, s);

  // update blob shader uniforms
  if (blobMat.userData.shader){
    blobMat.userData.shader.uniforms.uTime.value = t;
    // mouse in local space
    const ml = blob.worldToLocal(mouseWorld.clone());
    blobMat.userData.shader.uniforms.uMouseLocal.value.copy(ml);
  }

  // shadow opacity based on blob height
  shadow.material.opacity = THREE.MathUtils.clamp(0.22 - Math.abs(blob.position.y + 1.85)*0.08, 0, 0.18);
  shadow.position.x += (blob.position.x*0.35 - shadow.position.x)*0.06;
  shadow.scale.setScalar(1 + Math.sin(t*0.6)*0.06);

  // bubbles
  for (let i=0;i<bubbles.length;i++){
    const b = bubbles[i];
    const d = b.userData;
    // drift
    b.position.add(d.vel);
    // gentle orbit + bobbing
    const bx = Math.sin(t * d.speed * 0.7 + d.phase) * 0.35;
    const by = Math.cos(t * d.speed * 0.55 + d.phase*1.3) * 0.28;
    const bz = Math.sin(t * d.speed * 0.4 + d.phase*0.7) * 0.22;
    b.position.x += bx * delta * 0.6;
    b.position.y += by * delta * 0.6;
    b.position.z += bz * delta * 0.6;

    // attraction to mouse world
    const dist = b.position.distanceTo(mouseWorld);
    const attractRadius = 2.2;
    if (dist < attractRadius){
      const pull = (1 - dist/attractRadius) * 0.025;
      const dir = mouseWorld.clone().sub(b.position).normalize();
      b.position.add(dir.multiplyScalar(pull));
      // picked up if very close
      if (dist < 0.62){
        if (!d.picked){
          d.picked = true;
          d.pickOffset.copy(b.position).sub(mouseWorld);
        }
      }
    }
    if (d.picked){
      // follow cursor with soft offset
      const target = mouseWorld.clone().add(d.pickOffset.clone().multiplyScalar(0.35));
      b.position.lerp(target, 0.08);
      // if mouse far, release
      if (dist > 1.35){
        d.picked = false;
      }
      b.material.opacity = THREE.MathUtils.lerp(b.material.opacity, 0.92, 0.06);
      b.scale.setScalar(bubbleScales[i] * 1.08);
    } else {
      // drift back toward base + gentle return
      b.position.lerp(d.basePos, 0.002);
      // keep within bounds
      if (b.position.length() > 4.8){
        b.position.normalize().multiplyScalar(4.8);
        d.vel.negate().multiplyScalar(0.6);
      }
      // bounds bounce
      for (const ax of ['x','y','z']){
        if (Math.abs(b.position[ax]) > 4.2){
          d.vel[ax] *= -0.7;
        }
      }
      // restore scale/opacity
      b.scale.lerp(new THREE.Vector3().setScalar(bubbleScales[i]), 0.06);
      const targetOp = 0.58;
      b.material.opacity += (targetOp - b.material.opacity)*0.04;
    }

    // rotate bubbles slowly
    b.rotation.y += delta * d.speed * 0.5;
    b.rotation.x += delta * d.speed * 0.3;

    // drag
    d.vel.multiplyScalar(0.998);
  }

  renderer.render(scene, camera);
});

// ——— Resize ———
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}, {passive:true});

// ——— Reduced motion ———
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  renderer.setAnimationLoop(null);
}
</script>
</body>
</html>
